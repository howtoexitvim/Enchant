  const back=(label='返回',action='watchHome')=>button(t(label),action,'watch-back');
  const dots=(pages=[['main','记录'],['more','心率']])=>`<div class="watch-pager">${pages.map(([id,label])=>`<button class="page-dot ${watchSlide===id ? 'active' : ''}" aria-label="${t(label)}" data-action="watchSlide:${id}"><i></i></button>`).join('')}</div>`;
  const heart=()=>`<div class="watch-metrics"><span>${!hasHearts() ? '--' : '98'}<small>${t('平均 bpm')}</small></span><span>${!hasHearts() ? '--' : '112'}<small>${t('峰值 bpm')}</small></span></div>`;
  if (watchPage==='home') html=top()+`<div class="watch-main watch-home-body">${asset('plain-sword')}${button(t('附魔开始'),'start')}<div class="watch-shortcuts">${button(book+t('手账'),'watchJournal','ghost')}${button(settingsIcon+t('设置'),'watchSettings','ghost')}</div></div>`;
  if (watchPage==='session') html=top()+`<div class="watch-main watch-session-body">${!more ? `<div class="state">${t(scenario==='idle' ? '10秒后结束' : session?.phase==='recording' ? '正在附魔' : session?.phase==='paused' ? '已暂停' : '中断记录')}</div><div class="timer" id="watchTimer">${duration(session?.seconds||0)}</div><div class="watch-metrics"><span>${scenario==='permission'||session?.heartAvailable===false ? '--' : '98'}<small>${icons.heart}${t('心率 bpm')}</small></span><span>${session?.cycles||0}<small>${t('次数 · 估算')}</small></span></div><div class="watch-controls">${button(t(scenario==='idle' ? '继续' : session?.phase==='recording' ? '暂停' : '继续'),scenario==='idle' ? 'continueIdle' : 'pause','secondary')}${button(t('结束'),'finish')}</div>` : `<div class="watch-mini-chart">${healthChart()}</div>${heart()}${button(t('丢弃记录'),'discard','danger')}`}</div>${dots()}`;
  if (watchPage==='result') html=top()+`<div class="watch-main watch-result-body">${asset('enchanted-sword')}<h2 class="gold">${t('附魔完成')}</h2><div class="timer">${duration(session?.seconds??208)}</div><div class="watch-result-metric">${t('%@ bpm · %ld次估算',session?.heartAvailable===false||scenario==='permission' ? '--' : '98',session?.cycles??126)}</div>${scenario==='failure' ? button(t('重试保存'),'retry') : `<div class="watch-controls">${button(t('备注'),'editResult','secondary')}${button(t('完成'),'done')}</div>`}</div>`;
  if (watchPage==='journal') html=`<div class="watch-list-head">${book}<h2>${t('魔法手账')}</h2></div><input id="watchSearch" aria-label="${t('搜索日期或备注')}" placeholder="${t('搜索日期或备注')}" value="${esc(watchQuery)}"><div class="watch-records">${(scenario==='empty' ? [] : visible()).filter(record=>!watchQuery||matches(record,watchQuery)).map(record=>`<button class="watch-record" data-action="watchRecord:${record.id}"><span>${formatDay(record.day)}<small>${esc(record.note||t('%@记录',t(record.origin)))}</small></span><b>${duration(record.seconds)}</b></button>`).join('')||`<div class="watch-empty">${asset('magic-journal')}<p>${t('这页还空着')}</p></div>`}</div>${back()}`;
  if (watchPage==='detail') {
    const record=current()||fixtures()[0];
    html=top(formatDay(record.day))+`<div class="watch-main watch-detail-body">${watchSlide==='main' ? `<div class="timer">${duration(record.seconds)}</div>${heart()}<small>${t('%ld次估算 · %@',record.cycles,t(record.origin))}</small>` : watchSlide==='more' ? `<div class="watch-mini-chart">${healthChart()}</div><small>${t('实际样本 · 暂停断开')}</small>` : `<div class="watch-note-text">${noteHTML(record.note||t('还没有备注'))}</div>${button(t('编辑备注'),'watchNote','secondary')}${button(t('删除记录'),'delete','danger')}`}</div>${dots([['main','摘要'],['more','心率'],['note','备注']])}${back('返回手账','watchJournal')}`;
  }
  if (watchPage==='note') html=top(t('编辑备注'))+`<div class="watch-main watch-note-body">${asset('magic-journal')}<textarea id="watchNoteInput" placeholder="${t('写下备注…')}">${esc(current()?.note||'')}</textarea>${button(t('保存备注'),'saveWatchNote')}</div>${back('取消','watchDetail')}`;
  if (watchPage==='settings') html=top(t('偏好设置'))+`<div class="watch-main"><div class="watch-preferences">${[['自动开始','automatic','play'],['静止提醒','autoStop','pause'],['记录心率','health','heart'],['声音','sound','sound'],['触感','haptics','haptics']].map(([label,key,icon])=>`<button class="preference-tile ${prefs[key] ? 'on' : ''}" data-action="pref:${key}" aria-label="${t(label)}" aria-pressed="${!!prefs[key]}">${icons[icon]}<span>${t(label)}</span></button>`).join('')}<button class="preference-tile" data-action="watchTrash">${icons.trash}<span>${t('回收站')}</span></button></div></div>${back()}`;
  if (watchPage==='trash') html=top(t('回收站'))+`<div class="watch-records">${db.filter(record=>record.deleted).map(record=>`<div class="watch-record"><span>${formatDay(record.day)}</span>${button(t('恢复'),'restore:'+record.id,'ghost')}</div>`).join('')||`<div class="watch-empty"><span class="object-art">${icons.trash}</span><h2>${t('回收站为空')}</h2><p>${t('已删除记录可恢复')}</p></div>`}</div>${back('返回','watchSettings')}`;
  $('watch').innerHTML=html;
  const search=$('watchSearch');
  if (search) search.addEventListener('input',()=>{watchQuery=search.value; watch(); $('watchSearch').focus();});
}
function render() { phone(); watch(); document.querySelectorAll('.scenario').forEach(element=>element.classList.toggle('chosen',element.dataset.action==='scenario:'+scenario)); }
function noteHTML(text) { return String(text).split(/(https?:\/\/[^\s<>]+)/g).map(part=>{
  if (!/^https?:\/\//.test(part)) return esc(part);
  try { const url=new URL(part); if (url.username||url.password) return esc(part); return `<a href="${esc(url.href)}" target="_blank" rel="noopener noreferrer">${esc(part)}</a>`; } catch { return esc(part); }
}).join('').replace(/\n/g,'<br>'); }
function collectDraft(form) { return {note:form.elements.note.value}; }
function saveDraft() { const form=$('editor'); if (form) try { localStorage.setItem(STORAGE+'.draft.'+(editBase||current()).id,JSON.stringify(collectDraft(form))); } catch {} }
function bindForm() {
  const search=$('search');
  if (search) search.addEventListener('input',()=>{query=search.value; $('phone').classList.toggle('searching',!!query); $('searchResults').innerHTML=recordResults(scenario==='empty' ? [] : visible());});
  const form=$('editor');
  if (form) {
    form.addEventListener('input',saveDraft);
    form.addEventListener('submit',event=>{
      event.preventDefault(); const draft=collectDraft(form);
      try { const record=editBase||current(); if (!record) throw Error(t('记录已不存在。')); record.note=draft.note; record.links=[]; recordID=record.id; persist(); localStorage.removeItem(STORAGE+'.draft.'+record.id); detailPage='note'; phonePage='detail'; watchPage='detail'; watchSlide='note'; scenario='normal'; render(); toast(t('记录已保存。')); }
      catch (error) { $('formError').textContent=error.message; }
    });
  }
}
document.addEventListener('pointerdown',event=>{
  if (event.target.closest('.language-switch')) languagePointerFocus=document.activeElement;
});
document.addEventListener('click',event=>{
  const element=event.target.closest('[data-action]'); if (!element) return;
  event.preventDefault(); const action=element.dataset.action, [kind,value]=action.split(':');
  if (kind==='language') { setPreviewLanguage(value); return; }
  if (kind==='pref') { prefs[value]=!prefs[value]; render(); return; }
  if (kind==='watchSize') { $('watch').parentElement.classList.toggle('small-watch',value==='small'); document.querySelectorAll('.watch-size-control button').forEach(button=>button.classList.toggle('selected',button.dataset.action==='watchSize:'+value)); return; }
  if (kind==='watchSlide') { watchSlide=value; render(); return; }
  if (kind==='watchRecord') { recordID=value; watchSlide='main'; watchPage='detail'; render(); return; }
  if (kind==='detailPage') { detailPage=value; watchPage='detail'; watchSlide=value==='note' ? 'note' : 'main'; render(); return; }
  if (kind==='scenario') { selectScenario(value); return; }
  if (kind==='page') { phonePage=value; const mirror={home:'home',journal:'journal',settings:'settings',trash:'trash',detail:'detail'}; if (mirror[value]) { watchPage=mirror[value]; watchSlide='main'; } render(); return; }
  if (kind==='record') { recordID=value; detailPage='summary'; phonePage='detail'; watchPage='detail'; watchSlide='main'; scenario='normal'; render(); return; }
  if (kind==='day') { selected=value; render(); return; }
  if (kind==='month') { month=+value; selected=dayKey(new Date(year,month,1)); yearView=false; render(); return; }
  if (kind==='restore') { const record=db.find(record=>record.id===value); if (record) record.deleted=false; persist(); render(); toast(t('已恢复记录。')); return; }
  switch (action) {
    case 'start': session={seconds:0,phase:'recording',cycles:0,heartAvailable:prefs.health}; watchPage='session'; watchSlide='main'; phonePage='session'; scenario='normal'; break;
    case 'pause': if (session) session.phase=session.phase==='recording' ? 'paused' : 'recording'; break;
    case 'continueIdle': scenario='active'; break;
    case 'finish':
      watchPage='result'; watchSlide='main'; phonePage='result';
      if (prefs.autoSave) { const record={id:crypto.randomUUID(),day:dayKey(today),time:'21:41',seconds:session?.seconds||0,cycles:session?.cycles||0,note:'',links:[],origin:'手动',heartAvailable:session?.heartAvailable!==false,deleted:false}; db.unshift(record); recordID=record.id; persist(); }
      else scenario='pending';
      break;
    case 'retry': {
      scenario='normal'; if (!session) session={seconds:208,cycles:126};
      const record={id:crypto.randomUUID(),day:dayKey(today),time:'21:41',seconds:session.seconds,cycles:session.cycles,note:'',links:[],origin:'手动',heartAvailable:session?.heartAvailable!==false,deleted:false}; db.unshift(record); recordID=record.id; persist(); toast(t('保存完成。')); break;
    }
    case 'done': session=null; watchPage='home'; phonePage='journal'; scenario='normal'; selected=dayKey(today); break;
    case 'discard': session=null; watchPage='home'; phonePage='home'; toast(t('本次记录已丢弃。')); break;
    case 'watchHome': watchPage='home'; watchSlide='main'; break;
    case 'watchDetail': watchPage='detail'; break;
    case 'watchNote': watchPage='note'; break;
    case 'watchTrash': watchPage='trash'; break;
    case 'saveWatchNote': { const record=current(); if (record) { record.note=$('watchNoteInput').value; persist(); toast(t('备注已保存。')); } watchPage='detail'; watchSlide='note'; phonePage='detail'; detailPage='note'; break; }
    case 'watchJournal': watchPage='journal'; watchSlide='main'; break;
    case 'watchSettings': watchPage='settings'; watchSlide='main'; break;
    case 'cancelSearch': query=''; break;
    case 'yearMode': yearView=true; break;
    case 'monthMode': yearView=false; break;
    case 'today': year=2026; month=9; selected=dayKey(today); yearView=false; break;
    case 'previous': case 'next': { const offset=action==='next' ? 1 : -1; if (yearView) year+=offset; else { const date=new Date(year,month+offset,1); year=date.getFullYear(); month=date.getMonth(); selected=dayKey(date); } break; }
    case 'edit': case 'editResult': editBase=current(); phonePage='editor'; watchPage='note'; break;
    case 'delete': if (confirm(t('移到回收站？可以在设置中恢复。'))) { const record=current(); if (record) record.deleted=true; persist(); phonePage='journal'; if (watchPage==='detail') watchPage='journal'; toast(t('已移到回收站。')); } break;
  }
  render();
});
document.addEventListener('change',event=>{if (event.target.dataset.pref) { prefs[event.target.dataset.pref]=event.target.checked; render(); }});
$('reset').onclick=()=>{db=fixtures(); recordID=db[0].id; persist(); selectScenario('normal'); toast(t('演示记录已重置。'));};
setInterval(()=>{if (session?.phase==='recording'&&watchPage==='session') { session.seconds++; session.cycles+=2; for (const id of ['watchTimer','phoneTimer']) if ($(id)) $(id).textContent=duration(session.seconds); }},1000);
render();
</script></body></html>
